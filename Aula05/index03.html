<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8"/>
        <title> Aula 5 HTML </title>
    </head>
    <body>

        <h1> Utilizando o atributo style para definir estilos em elementos no HTML: </h1>

        <p style="color: orangered"> Eu sou laranja </p>
        <p style="color:brown"> Eu sou marrom </p>
        <p style="font-size: 30px; font-weight: bold;"> Eu estou destacado </p>

        <hr>

        <h3> Definindo cores de fundo com o atributo style no HTML: </h3>

        <h2 style="background-color: tomato;"> Eu so um H2 </h2>
        <p style="background-color: mediumslateblue;"> Eu sou um parágrafo </p>

    </body>
</html>

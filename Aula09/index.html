<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title> Aula 09 - Conteudo HTML</title>
    </head>
    <body>

        <h1> Imagens em HTML </h1>

        <img src="Twice Wallpaper.jpg" alt="Wallpaper para Desktop do Grupo feminino Twice" width="600" height="300">

        <hr>

        <h3> Alterando o tamanho da imagem com o CSS </h3>

        <img src="Twice Wallpaper.jpg" alt="Wallpaper para Desktop do Grupo feminino Twice" style="width: 600px; height: 250;">

        <hr>

        <h3> Definindo imagens localizadas em outra pasta</h3>

        <img src="imagens/fred.jpeg" width="300" height="600" alt="Foto do Frederico, meu gato">

        <hr>
        
        <h3> Definindo imagens dinâmicas no HTML</h3>

        <img src="imagens/pompompurinn.gif" alt="Pompompurin piscando" style="width: 300px; height: 300px;">

        <hr>

        <h3> Imagens flutuantes no HTML </h3>

        <p> 
            <img src="imagens/pompompurinn.gif" style="width: 40px; height: 40px; "> 
            Pompompurin está piscando para você!!
        </p>
    </body>
</html>

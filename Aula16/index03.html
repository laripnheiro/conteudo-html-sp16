<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula 16 - HTML</title>
</head>
<body>

    <h1>Formulários no HTML</h1>

    <form>
        <label for="pnome">Primeiro Nome:</label>
        <br>
        <input type="text" name="pnome" id="pnome">
        <br>
        <label for="snome">Segundo Nome:</label>
        <br>
        <input type="text" name="snome" id="snome">
        <br>
        <input type="button" value="Enviar">
    </form>

    <hr>

    <h3>Inputs tipo Radio</h3>

    <form>
        <input type="radio" name="linguagem-fav" id="op-html" value="HTML">
        <label for="op-html">HTML</label>
        <br>
        <input type="radio" name="linguagem-fav" id="op-css" value="CSS">
        <label for="op-css">CSS</label>
        <br>
        <input type="radio" name="linguagem-fav" id="op-js" value="JavaScript">
        <label for="op-js">JavaScript</label>
    </form>

    <hr>

    <h3>Inputs tipo checkbox</h3>

    <form>
        <input type="checkbox" name="fruta1" id="f-melancia" value="Melancia">
        <label for="f-melancia">Melancia</label>
        <br>
        <input type="checkbox" name="fruta2" id="f-laranja" value="Laranja">
        <label for="f-laranja">Laranja</label>
        <br>
        <input type="checkbox" name="fruta3" id="f-manga" value="Manga">
        <label for="f-manga">Manga</label>
        <br>
    </form>
</body>
</html>

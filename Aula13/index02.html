<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> Conteudo Aula13 - HTML </title>
        <style>

            #my-h2{
                background-color:cornflowerblue;
                color: darkred;
                border: 4px solid cadetblue;
                padding: 10px;
            }
        </style>
    </head>
    <body>

        <h1> ID em HTML</h1>

        <h2 id="my-h2"> Break my face - AJR</h2>

        <hr>

        <h3 id="my-h3">You run your mouth</h3>

        <button onclick="changeContent()">Change content</button>

        <script>

            function changeContent(){
                document.getElementById("my-h3").innerHTML = "You tongue fell out";
                document.getElementById("my-h3").style.color = "cornflowerblue";
                document.getElementById("my-h3").style.fontSize = "28px";
            }
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title> Conteudo Aula 13 - HTML</title>
        <style>

            .destaque{
                color: red;
                font-weight: bold;
                font-size: 150%;
            }

            .cidades{
                background-color: olive;
                padding: 10px;
                color: aliceblue;
            }

            .centralizado{
                text-align: center;
            }

            .borda{
                border-bottom: 2px solid black;
            }

            .mesma-classe{
                background-color: darkorange;
                padding: 4px;
                font-size: 20px;
                border: 4px solid black;
            }
        </style>
    </head>
    <body>

        <h1> Class no HTML </h1>

        <h2> Exemplo de <span class="destaque">importância</span> no conteúdo</h2>

        <p>Exemplo de <span class="destaque">importância</span> no conteúdo</p>

        <hr>

        <h3> Definindo mais de uma classe para elementos</h3>

        <h2 class="cidades centralizado"> <span class="borda">São Paulo</span></h2>

        <h2 class="cidades"> Belo Horizonte </h2>

        <h2 class="cidades"> Natal </h2>

        <hr>

        <h3>Elementos dferentes com a mesma classe </h3>

        <h4 class="mesma-classe">Isso é um h4</h4>
        <p class="mesma-classe">Isso é um parágrafo</p>
    </body>
</html>
